name: Blogger Add Internal Links

# 이미 발행된 글에 '함께 읽으면 좋은 글' 블록을 넣는다.
#
# 감사 결과 발행된 24편이 전부 내부 링크 0개였다. generate_post.py 는 앞으로
# 쓰는 글에만 링크를 넣으므로, 이미 올라간 글은 이 워크플로로 따로 손봐야
# 한다. 여러 번 돌려도 안전하다 (이미 블록이 있는 글은 건너뛴다).
#
# 글을 추린 뒤에 돌리세요. 먼저 돌리면 곧 내려갈 글까지 링크 대상이 됩니다.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: '실제로 글을 수정 (끄면 미리보기)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: blogger-internal-links
  cancel-in-progress: false

jobs:
  add-links:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r blogger_blog/scripts/requirements.txt

      - name: 삽입 로직 자체 테스트
        run: python -m pytest blogger_blog/tests/test_add_internal_links.py -q

      - name: 내부 링크 삽입
        env:
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
        run: |
          if [ "${{ inputs.apply }}" = "true" ]; then
            python blogger_blog/scripts/add_internal_links.py --apply
          else
            python blogger_blog/scripts/add_internal_links.py
          fi
