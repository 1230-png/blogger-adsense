name: Blogger Required Pages

# 소개 · 문의 · 개인정보처리방침 · 면책조항 페이지를 Blogger 에 게시한다.
#
# 애드센스 심사에서 사이트의 신뢰성을 확인할 때 보는 페이지들이고, 이전
# 파이프라인에는 이걸 만드는 코드가 아예 없었다. 여러 번 돌려도 안전하다
# (있으면 갱신, 없으면 생성).
#
# 자동 스케줄을 두지 않은 이유: 매일 돌리면 '최종 수정일'만 바뀐 페이지를
# 계속 다시 쓰게 된다. blogger_blog/pages/*.html 을 고쳤을 때 수동으로 실행한다.

on:
  workflow_dispatch:
    inputs:
      contact_email:
        description: '페이지에 표시할 문의용 이메일 (비우면 BLOGGER_CONTACT_EMAIL 시크릿 사용)'
        required: false
        default: ''
      dry_run:
        description: '실제로 발행하지 않고 결과만 확인'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: blogger-pages
  cancel-in-progress: false

jobs:
  publish-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r blogger_blog/scripts/requirements.txt

      - name: 템플릿 검사
        run: python -m pytest blogger_blog/tests/test_publish_pages.py -q

      - name: 페이지 게시
        env:
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          # 페이지에 표시할 문의용 이메일. 이 저장소는 public 이므로 파일이
          # 아니라 시크릿으로 넣는다.
          BLOGGER_CONTACT_EMAIL: ${{ secrets.BLOGGER_CONTACT_EMAIL }}
          BLOGGER_BLOG_NAME: ${{ secrets.BLOGGER_BLOG_NAME }}
        run: |
          ARGS=()
          if [ -n "${{ inputs.contact_email }}" ]; then
            ARGS+=(--contact-email "${{ inputs.contact_email }}")
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          python blogger_blog/scripts/publish_pages.py "${ARGS[@]}"

      - name: 다음 할 일 안내
        if: success()
        run: |
          {
            echo "### 페이지 게시 완료"
            echo ""
            echo "⚠️ **페이지를 만들어도 블로그 메뉴에 자동으로 걸리지는 않습니다.**"
            echo ""
            echo "Blogger 관리 화면 → **레이아웃** → **가젯 추가** → **페이지** 를 추가하고,"
            echo "소개 · 문의 · 개인정보처리방침 · 면책조항 네 개가 모두 표시되도록 체크하세요."
            echo "심사자가 사이트에서 이 페이지들을 찾을 수 있어야 의미가 있습니다."
          } >> $GITHUB_STEP_SUMMARY
