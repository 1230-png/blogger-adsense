name: Blogger Blog Daily

on:
  schedule:
    # UTC 0시 = 한국 시간 오전 9시. 하루 1편.
    #
    # 이전에는 하루 2편(0시/12시)이었다. 사람 검토 없이 LLM으로 생성한 글을
    # 하루 2편씩 쌓는 것은 Google 이 'scaled content abuse'(대규모 콘텐츠
    # 남용)로 설명하는 패턴에 그대로 해당하고, 애드센스 반려 사유였던
    # "가치가 별로 없는 콘텐츠"와 같은 뿌리다. 발행 빈도를 줄이는 것 자체가
    # 이번 수정의 일부다.
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      category:
        description: '카테고리 (비우면 무작위): finance, health, tech, life, self_dev'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: blogger-blog
  cancel-in-progress: false

jobs:
  publish-post:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # 발행 기록 커밋 단계에서 rebase 하려면 전체 히스토리가 필요하다.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r blogger_blog/scripts/requirements.txt

      # 품질 게이트가 깨진 채로 글을 발행하면 반려 사유를 그대로 재생산한다.
      # 네트워크도 자격증명도 쓰지 않으므로 몇 초면 끝난다.
      - name: 0️⃣ 품질 게이트 자체 테스트
        run: python -m pytest blogger_blog/tests -q

      - name: 1️⃣ 주제 선정
        id: topic
        env:
          # topics.csv 가 소진되면 pick_topic.py 가 Groq 로 새 주제를 만든다.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python blogger_blog/scripts/pick_topic.py "${{ github.event.inputs.category }}" > topic.json
          cat topic.json

      - name: 2️⃣ 글 생성 (Groq)
        id: generate
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          cat topic.json | python blogger_blog/scripts/generate_post.py > post.json

      # publish_post.py 가 발행 직전에 quality.py 게이트를 다시 돌린다.
      # 미달이면 발행하지 않고 실패한다 — 얇은 글을 올리느니 하루 건너뛴다.
      - name: 3️⃣ 품질 게이트 통과 시 Blogger 발행
        id: publish
        env:
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_LABELS_EXTRA: ${{ secrets.BLOGGER_LABELS_EXTRA }}
        run: |
          cat post.json | python blogger_blog/scripts/publish_post.py > publish_result.json
          cat publish_result.json

      - name: 4️⃣ 발행 기록 커밋
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blogger_blog/data/used_topics.json
          if git diff --cached --quiet; then
            echo "기록할 변경사항 없음"
          else
            git commit -m "📝 Blogger: $(date '+%Y-%m-%d %H:%M') 발행 기록 [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi

      - name: 📊 결과 요약
        if: always()
        run: |
          echo "=== Blogger Blog Daily ===" >> $GITHUB_STEP_SUMMARY
          if [ -f publish_result.json ]; then
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat publish_result.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ 발행 결과 없음. 품질 게이트에 걸렸을 수 있습니다 — 위 로그의 🔴 항목을 확인하세요." >> $GITHUB_STEP_SUMMARY
          fi
